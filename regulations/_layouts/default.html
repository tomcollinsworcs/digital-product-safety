<html lang="en">

    <meta charset="utf-8"/>

    <meta name="author" content="Tom Collins MP et al"/>
    <style type="text/css">
        html { scroll-behavior: smooth; font-family: Arial, Helvetica, sans-serif; }
        body { overflow-x: auto; }
        table, th, td {border: 1px solid black; border-collapse: collapse; padding: 4px; }

</head>

  <style>
    body {
      margin: 0;

      margin: 40px auto;

</head>

<body>

  <header class="site-header">
    <strong>"&lt;DSI&#8725;&gt;"</strong>

    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="https://digital-safety-initiative.org">DSI</a>
      <a href="https://github.com/tomcollinsworcs/digital-product-safety">Contribute</a>
    </nav>
  </header>

  <main class="document">
    {{ content }}
  </main>

</html>
